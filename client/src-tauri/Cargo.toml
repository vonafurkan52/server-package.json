[package]
name = "ekip-ses"
version = "1.0.0"
description = "Dusuk sistem tuketimli oyun ici ses ve muzik uygulamasi"
authors = ["Ekip"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
