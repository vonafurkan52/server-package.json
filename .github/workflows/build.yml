name: FurkanCELL Masaustu Derleyici (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rust Kur
        uses: dtolnay/rust-toolchain@stable

      - name: FurkanCELL v6.1 Dosyalarini Hatasiz Olustur
        shell: bash
        run: |
          mkdir -p app/src

          cat << 'EOF' > app/Cargo.toml
          [package]
          name = "FurkanCELL"
          version = "6.1.0"
          edition = "2021"

          [dependencies]
          tao = "0.26"
          wry = "0.37"
          tiny_http = "0.12"
          EOF

          cat << 'EOF' > app/src/index.html
