name: FurkanCELL Masaustu Derleyici (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rust Kur
        uses: dtolnay/rust-toolchain@stable

      - name: Tum Uygulamayi Hazirla
        shell: bash
        run: |
          cat << 'EOF' > generate.js
          const fs = require("fs");
          fs.mkdirSync("app/src", { recursive: true });

          fs.writeFileSync("app/Cargo.toml", [
            '[package]',
            'name = "FurkanCELL"',
            'version = "6.3.0"',
            'edition = "2021"',
            '',
            '[dependencies]',
            'tao = "0.26"',
            'wry = "0.37"',
            'tiny_http = "0.12"'
          ].join("\n"));

          fs.writeFileSync("app/src/main.rs", [
            '#![windows_subsystem = "windows"]',
            'use std::thread;',
            'use tao::{',
            '  event::{Event, WindowEvent},',
            '  event_loop::{ControlFlow, EventLoop},',
            '  window::WindowBuilder,',
            '};',
            'use wry::WebViewBuilder;',
            'use tiny_http::{Server, Response, Header};',
            '',
            'fn main() -> wry::Result<()> {',
            '  let html_content = include_str!("index.html");',
            '  let server = Server::http("127.0.0.1:0").unwrap();',
            '  let port = server.server_addr().to_ip().unwrap().port();',
            '',
            '  thread::spawn(move || {',
            '    for request in server.incoming_requests() {',
            '      let header = Header::from_bytes(&b"Content-Type"[..], &b"text/html; charset=utf-8"[..]).unwrap();',
            '      let response = Response::from_string(html_content).with_header(header);',
            '      let _ = request.respond(response);',
            '    }',
            '  });',
            '',
            '  let event_loop = EventLoop::new();',
            '  let window = WindowBuilder::new()',
            '    .with_title("FurkanCELL v6.3")',
            '    .with_inner_size(tao::dpi::LogicalSize::new(540.0, 820.0))',
            '    .build(&event_loop)',
            '    .unwrap();',
            '',
            '  let url = format!("http://127.0.0.1:{}", port);',
            '  let _webview = WebViewBuilder::new(&window)',
            '    .with_url(&url)',
            '    .build()?;',
            '',
            '  event_loop.run(move |event, _, control_flow| {',
            '    *control_flow = ControlFlow::Wait;',
            '    if let Event::WindowEvent { event: WindowEvent::CloseRequested, .. } = event {',
            '      *control_flow = ControlFlow::Exit;',
            '    }',
