name: Masaustu Uygulamasini Derle (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rust Kur
        uses: dtolnay/rust-toolchain@stable

      - name: Tum Uygulamayi Hazirla
        shell: bash
        run: |
          cat << 'EOF' > generate.js
          const fs = require("fs");
          fs.mkdirSync("app/src", { recursive: true });

          fs.writeFileSync("app/Cargo.toml", `[package]
          name = "ekip-ses"
          version = "1.0.0"
          edition = "2021"

          [dependencies]
          tao = "0.26"
          wry = "0.37"
          `);

          const html = `<!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8" />
            <title>Ekip Ses & Müzik</title>
            <style>
              * { box-sizing: border-box; }
              body { background: #121214; color: #e1e1e6; font-family: system-ui, sans-serif; padding: 18px; margin: 0; user-select: none; }
              h2, h3 { margin-top: 0; color: #fff; }
              .box { background: #202024; padding: 16px; border-radius: 10px; margin-bottom: 14px; border: 1px solid #29292e; }
              .row { display: flex; gap: 8px; margin-bottom: 10px; }
              input[type="text"] { background: #121214; color: white; border: 1px solid #323238; padding: 10px 12px; border-radius: 6px; flex: 1; font-size: 14px; outline: none; }
              input[type="text"]:focus { border-color: #5865F2; }
              button { background: #5865F2; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
              button:hover { background: #4752C4; }
              button.mute-btn { background: #29292e; }
              button.mute-btn.muted { background: #ed4245; }
              .user-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #29292e; }
              .slider { width: 120px; accent-color: #5865F2; cursor: pointer; }
              .badge { font-size: 12px; background: #29292e; padding: 4px 8px; border-radius: 4px; color: #a8a8b3; }
              .status { font-size: 13px; color: #04d361; font-weight: 600; }
              #log-msg { font-size: 12px; color: #fba94c; margin-top: 6px; }
            </style>
          </head>
          <body>
            <div class="box" id="login-box">
              <h2>🎧 Ekip Ses & Müzik</h2>
              <p style="color:#a8a8b3; font-size:13px;">Sunucu kurulumu gerektirmeyen, oyun sesini kısmayan özel oda.</p>
              <div class="row">
                <input type="text" id="room-input" value="ekip-oda-1" placeholder="Oda Adı (Arkadaşlarınla aynı olmalı)" />
              </div>
              <div class="row">
                <input type="text" id="username" placeholder="Takma Adın (Örn: Furkan)" />
                <button id="join-btn">Odaya Bağlan</button>
              </div>
              <div id="log-msg"></div>
            </div>

            <div id="app-box" style="display:none;">
              <div class="box">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                  <div class="status" id="room-title">● Odaya Bağlı</div>
                  <button id="mute-self-btn" class="mute-btn">🎤 Mikrofon Açık</button>
                </div>
                <h3>Odadaki Kişiler</h3>
                <div id="users-list"></div>
              </div>

              <div class="box">
                <h3>🎵 Ortak YouTube Music</h3>
                <div class="row">
                  <input type="text" id="music-query" placeholder="Şarkı adı veya YouTube linki yaz..." />
                  <button id="play-btn">Herkeste Çal</button>
                </div>
                <p id="now-playing" style="font-size:13px; color:#04d361; margin: 6px 0;">Şu an çalan: Yok</p>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
                  <span style="font-size:13px;">Müzik Sesi:</span>
                  <input type="range" id="music-vol" min="0" max="100" value="35" class="slider" />
                </div>
                <div id="yt-player" style="width:1px; height:1px; overflow:hidden; opacity:0.01;"></div>
              </div>
            </div>

            <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
            <script src="https://www.youtube.com/iframe_api"></script>
            <script>
              let localStream, audioCtx, ytPlayer, isMuted = false;
              let myPeer, isHost = false;
              let myName = "Oyuncu";
              const connections = {};
              const mediaCalls = {};
              const peerNames = {};

              function onYouTubeIframeAPIReady() {
                ytPlayer = new YT.Player("yt-player", {
                  height: "1", width: "1",
                  playerVars: { autoplay: 1, controls: 0 }
                });
              }

              document.getElementById("join-btn").addEventListener("click", async () => {
                const btn = document.getElementById("join-btn");
                const log = document.getElementById("log-msg");
                myName = document.getElementById("username").value.trim() || "Oyuncu-" + Math.floor(Math.random()*100);
                const roomName = document.getElementById("room-input").value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "") || "ekip-oda-1";

                btn.disabled = true;
                log.innerText = "Mikrofon ve ses motoru hazırlanıyor...";

                try {
                  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  localStream = await navigator.mediaDevices.getUserMedia({
                    video: false,
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
                  });
                } catch (err) {
                  log.innerText = "Mikrofon izni alınamadı veya mikrofon yok, dinleyici modunda giriliyor...";
                  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  const dest = audioCtx.createMediaStreamDestination();
                  localStream = dest.stream;
                }

                log.innerText = "Odaya bağlanılıyor...";
                initRoom(roomName);
              });

              function initRoom(roomName) {
                const hostId = "ekipses-room-" + roomName;
                const tempPeer = new Peer(hostId);

                tempPeer.on("open", () => {
                  isHost = true;
                  myPeer = tempPeer;
                  enterAppUI(roomName, true);
                  setupHostListeners();
                });

                tempPeer.on("error", (err) => {
                  if (err.type === "unavailable-id") {
                    isHost = false;
                    myPeer = new Peer();
                    myPeer.on("open", () => {
                      enterAppUI(roomName, false);
                      connectToHost(hostId);
                    });
                  } else {
                    document.getElementById("log-msg").innerText = "Bağlantı hatası: " + err.type;
                    document.getElementById("join-btn").disabled = false;
                  }
                });
              }

              function enterAppUI(roomName, hostStatus) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("app-box").style.display = "block";
                document.getElementById("room-title").innerText = "● Oda: " + roomName + (hostStatus ? " (Kurucu)" : "");
                addSelfRow();

                myPeer.on("call", (call) => {
                  call.answer(localStream);
                  handleCall(call, call.metadata ? call.metadata.name : "Arkadaş");
                });
              }

              function addSelfRow() {
                const list = document.getElementById("users-list");
                const row = document.createElement("div");
                row.className = "user-row";
                row.innerHTML = "<span>🟢 " + myName + " (Sen)</span><span class='badge'>Aktif</span>";
                list.appendChild(row);
              }

              function setupHostListeners() {
                myPeer.on("connection", (conn) => {
                  conn.on("data", (data) => {
                    if (data.type === "join") {
                      peerNames[conn.peer] = data.name;
                      connections[conn.peer] = conn;
                      const existing = Object.keys(connections).filter(k => k !== conn.peer).map(k => ({ id: k, name: peerNames[k] }));
                      conn.send({ type: "peer-list", peers: existing, hostName: myName });
                      callPeer(conn.peer, data.name);
                    } else if (data.type === "music") {
                      playVideo(data.videoId, data.title);
                      broadcastData(data);
                    }
                  });
                  conn.on("close", () => removeUserUI(conn.peer));
                });
              }

              function connectToHost(hostId) {
                const conn = myPeer.connect(hostId);
                connections[hostId] = conn;
                conn.on("open", () => {
                  conn.send({ type: "join", name: myName });
                });
                conn.on("data", (data) => {
                  if (data.type === "peer-list") {
                    peerNames[hostId] = data.hostName;
                    data.peers.forEach(p => {
                      peerNames[p.id] = p.name;
                      callPeer(p.id, p.name);
                    });
                  } else if (data.type === "music") {
                    playVideo(data.videoId, data.title);
                  }
                });
              }

              function callPeer(targetId, targetName) {
                const call = myPeer.call(targetId, localStream, { metadata: { name: myName } });
                handleCall(call, targetName);
              }

              function handleCall(call, remoteName) {
                mediaCalls[call.peer] = call;
                call.on("stream", (remoteStream) => {
                  const nameToShow = peerNames[call.peer] || remoteName || "Oyuncu";
                  setupAudioMixer(call.peer, nameToShow, remoteStream);
                });
                call.on("close", () => removeUserUI(call.peer));
              }

              function setupAudioMixer(peerId, name, stream) {
                if (document.getElementById("user-" + peerId)) return;

                const source = audioCtx.createMediaStreamSource(stream);
                const gainNode = audioCtx.createGain();
                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                const audio = new Audio();
                audio.srcObject = stream;
                audio.muted = true;
                audio.play().catch(()=>{});

                const list = document.getElementById("users-list");
                const row = document.createElement("div");
                row.className = "user-row";
                row.id = "user-" + peerId;
                row.innerHTML = "<span>🎙️ " + name + "</span><div style='display:flex;align-items:center;gap:8px;'><span class='badge' id='vol-" + peerId + "'>100%</span><input type='range' min='0' max='2' step='0.05' value='1' class='slider' /></div>";
                row.querySelector("input").addEventListener("input", (ev) => {
                  const val = parseFloat(ev.target.value);
                  gainNode.gain.value = val;
                  document.getElementById("vol-" + peerId).innerText = Math.round(val * 100) + "%";
                });
                list.appendChild(row);
              }

              function removeUserUI(peerId) {
                delete connections[peerId];
                delete mediaCalls[peerId];
                const el = document.getElementById("user-" + peerId);
                if (el) el.remove();
              }

              function broadcastData(data) {
                Object.values(connections).forEach(c => { if (c.open) c.send(data); });
              }

              document.getElementById("mute-self-btn").addEventListener("click", (e) => {
                if (!localStream) return;
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
                e.target.innerText = isMuted ? "🔇 Mikrofon Kapalı" : "🎤 Mikrofon Açık";
                e.target.classList.toggle("muted", isMuted);
              });

              async function resolveYouTube(query) {
                const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
                const match = query.match(reg);
                if (match && match[1]) return { videoId: match[1], title: "YouTube Linki (" + match[1] + ")" };

                const apis = [
                  "https://pipedapi.kavin.rocks/search?q=" + encodeURIComponent(query) + "&filter=music_songs",
                  "https://pipedapi.tokhmi.xyz/search?q=" + encodeURIComponent(query) + "&filter=videos"
                ];
                for (const url of apis) {
                  try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                      const item = data.items[0];
                      const vid = item.url.split("v=")[1] || item.url.split("/").pop();
                      return { videoId: vid, title: item.title };
                    }
                  } catch (e) {}
                }
                return null;
              }

              function playVideo(videoId, title) {
                document.getElementById("now-playing").innerText = "🎵 Çalıyor: " + title;
                if (ytPlayer && ytPlayer.loadVideoById) {
                  ytPlayer.loadVideoById(videoId);
                  ytPlayer.setVolume(document.getElementById("music-vol").value);
                }
              }

              document.getElementById("play-btn").addEventListener("click", async () => {
                const q = document.getElementById("music-query").value.trim();
                if (!q) return;
                document.getElementById("now-playing").innerText = "Şarkı aranıyor...";
                const result = await resolveYouTube(q);
                if (result) {
                  playVideo(result.videoId, result.title);
                  broadcastData({ type: "music", videoId: result.videoId, title: result.title });
                } else {
                  document.getElementById("now-playing").innerText = "Bulunamadı. Lütfen doğrudan YouTube linki yapıştırın.";
                }
              });

              document.getElementById("music-vol").addEventListener("input", (e) => {
                if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(e.target.value);
              });
            </script>
          </body>
          </html>`;

          fs.writeFileSync("app/src/index.html", html);

          fs.writeFileSync("app/src/main.rs", `#![windows_subsystem = "windows"]
          use std::borrow::Cow;
          use tao::{
            event::{Event, WindowEvent},
            event_loop::{ControlFlow, EventLoop},
            window::WindowBuilder,
          };
          use wry::{WebViewBuilder, http::Response};

          fn main() -> wry::Result<()> {
            let event_loop = EventLoop::new();
            let window = WindowBuilder::new()
              .with_title("Ekip Ses & Müzik")
              .with_inner_size(tao::dpi::LogicalSize::new(480.0, 620.0))
              .build(&event_loop)
              .unwrap();

            let html_bytes = include_bytes!("index.html");

            let _webview = WebViewBuilder::new(&window)
              .with_custom_protocol("ekip".into(), move |_req| {
                Response::builder()
                  .header("Content-Type", "text/html; charset=utf-8")
                  .header("Access-Control-Allow-Origin", "*")
                  .body(Cow::Borrowed(html_bytes.as_slice()))
                  .unwrap()
              })
              .with_url("ekip://localhost")
              .build()?;

            event_loop.run(move |event, _, control_flow| {
              *control_flow = ControlFlow::Wait;
              if let Event::WindowEvent { event: WindowEvent::CloseRequested, .. } = event {
                *control_flow = ControlFlow::Exit;
              }
            });
          }
          `);
          EOF
          node generate.js

      - name: .exe Derle
        working-directory: ./app
        run: cargo build --release

      - name: .exe Dosyasini Indirmeye Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: EkipSes-Windows-Exe
          path: ./app/target/release/ekip-ses.exe
