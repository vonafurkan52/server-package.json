                padding: 16px;
                margin: 0;
                min-height: 100vh;
                overflow-x: hidden;
              }
              h2, h3 { margin-top: 0; color: #ff85c0; }
              .top-bar {
                background: linear-gradient(90deg, #ff1493, #ff69b4);
                color: #fff;
                padding: 8px 12px;
                border-radius: 8px;
                font-weight: bold;
                font-size: 13px;
                margin-bottom: 14px;
                text-align: center;
                box-shadow: 0 4px 12px rgba(255, 20, 147, 0.35);
              }
              .box {
                background: rgba(43, 9, 26, 0.9);
                padding: 14px;
                border-radius: 12px;
                margin-bottom: 12px;
                border: 1px solid #ff2a85;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
