name: Masaustu Uygulamasini Derle (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Kur
        uses: dtolnay/rust-toolchain@stable

      - name: Dosyalari Dogrudan Olustur
        shell: bash
        run: |
          mkdir -p app/src

          cat << 'EOF' > app/Cargo.toml
          [package]
          name = "ekip-ses-v3"
          version = "3.0.0"
          edition = "2021"

          [dependencies]
          tao = "0.26"
          wry = "0.37"
          tiny_http = "0.12"
          EOF

          cat << 'EOF' > app/src/index.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8" />
            <title>Ekip Ses v3.0</title>
            <style>
              * { box-sizing: border-box; }
              body { background: #121214; color: #e1e1e6; font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
              h2, h3 { margin-top: 0; color: #fff; }
              .top-bar { background: #04d361; color: #000; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; margin-bottom: 12px; text-align: center; }
              .box { background: #202024; padding: 16px; border-radius: 10px; margin-bottom: 14px; border: 1px solid #29292e; }
              .row { display: flex; gap: 8px; margin-bottom: 10px; }
              input[type="text"] { background: #121214; color: white; border: 1px solid #323238; padding: 10px 12px; border-radius: 6px; flex: 1; font-size: 14px; }
              button { background: #5865F2; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
              button:active { transform: scale(0.97); }
              button.mute-btn { background: #29292e; }
              button.mute-btn.muted { background: #ed4245; }
              .user-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #29292e; }
              .slider { width: 110px; accent-color: #5865F2; cursor: pointer; }
              .badge { font-size: 12px; background: #29292e; padding: 4px 8px; border-radius: 4px; color: #a8a8b3; }
              .status { font-size: 13px; color: #04d361; font-weight: 600; }
            </style>
          </head>
          <body>
            <div class="top-bar" id="sys-bar">✅ SÜRÜM 3.0 AKTİF - SİSTEM HAZIR</div>

            <div class="box" id="login-box">
              <h2>🎧 Ekip Ses & Müzik v3</h2>
              <div class="row">
                <input type="text" id="room-input" value="ekip-oda-1" placeholder="Oda Adı" />
              </div>
              <div class="row">
                <input type="text" id="username" value="Furkan" placeholder="Takma Adın" />
                <button type="button" id="join-btn" onclick="baglan()">Odaya Bağlan</button>
              </div>
            </div>

            <div id="app-box" style="display:none;">
              <div class="box">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                  <div class="status" id="room-title">● Odaya Girildi</div>
                  <button type="button" id="mute-self-btn" class="mute-btn" onclick="mikrofonAcKapat()">🎤 Mikrofon Açık</button>
                </div>
                <h3>Odadaki Kişiler</h3>
                <div id="users-list"></div>
              </div>

              <div class="box">
                <h3>🎵 Ortak YouTube Music</h3>
                <div class="row">
                  <input type="text" id="music-query" placeholder="YouTube linki veya şarkı adı yaz..." />
                  <button type="button" onclick="muzikCal()">Herkeste Çal</button>
                </div>
                <p id="now-playing" style="font-size:13px; color:#04d361; margin: 6px 0;">Şu an çalan: Yok</p>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
                  <span style="font-size:13px;">Müzik Sesi:</span>
                  <input type="range" id="music-vol" min="0" max="100" value="40" class="slider" oninput="sesAyarla(this.value)" />
                </div>
                <div id="yt-wrap" style="margin-top:10px; border-radius:8px; overflow:hidden; height:90px; background:#000;">
                  <div id="yt-player"></div>
                </div>
              </div>
            </div>

            <script>
              let localStream = null;
              let audioCtx = null;
              let ytPlayer = null;
              let isMuted = false;
              let myPeer = null;
              let isHost = false;
              let myName = "Furkan";
              const connections = {};
              const peerNames = {};

              // 1. Butona basildigi an HICBIR kutuphaneyi beklemeden ekrani degistir!
              function baglan() {
                try {
                  myName = document.getElementById("username").value.trim() || "Oyuncu";
                  const rawRoom = document.getElementById("room-input").value.trim().toLowerCase();
                  const roomName = rawRoom.replace(/[^a-z0-9-]/g, "") || "ekip-oda-1";

                  document.getElementById("login-box").style.display = "none";
                  document.getElementById("app-box").style.display = "block";
                  document.getElementById("sys-bar").innerText = "🟢 ODAYA GİRİŞ YAPILDI: " + roomName.toUpperCase();

                  const list = document.getElementById("users-list");
                  list.innerHTML = '<div class="user-row"><span>🟢 ' + myName + ' (Sen)</span><span class="badge" id="my-mic-badge">Mikrofon Açılıyor...</span></div>';

                  mikrofonuHazirla(roomName);
                } catch (e) {
                  document.getElementById("sys-bar").innerText = "Hata: " + e.message;
                }
              }

              async function mikrofonuHazirla(roomName) {
                try {
                  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  localStream = await navigator.mediaDevices.getUserMedia({
                    video: false,
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
                  });
                  document.getElementById("my-mic-badge").innerText = "Mikrofon Aktif";
                } catch (err) {
                  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  const dest = audioCtx.createMediaStreamDestination();
                  localStream = dest.stream;
                  document.getElementById("my-mic-badge").innerText = "Dinleyici Modu";
                }

                peerBaglantisiniKur(roomName);
              }

              function peerBaglantisiniKur(roomName) {
                if (typeof Peer === "undefined") {
                  document.getElementById("room-title").innerText = "⚠️ Ses sunucusu yükleniyor, lütfen 2 sn bekleyin...";
                  setTimeout(function() { peerBaglantisiniKur(roomName); }, 1500);
                  return;
                }

                const hostId = "ekipses-v3-room-" + roomName;
                const tempPeer = new Peer(hostId);

                tempPeer.on("open", function() {
                  isHost = true;
                  myPeer = tempPeer;
                  document.getElementById("room-title").innerText = "● Oda: " + roomName + " (Kurucu - Online)";
                  ortakPeerAyarlari();
                  hostDinleyicileri();
                });

                tempPeer.on("error", function(err) {
                  if (err.type === "unavailable-id") {
                    isHost = false;
                    myPeer = new Peer();
                    myPeer.on("open", function() {
                      document.getElementById("room-title").innerText = "● Oda: " + roomName + " (Üye - Online)";
                      ortakPeerAyarlari();
                      hostaBaglan(hostId);
                    });
                  } else {
                    document.getElementById("room-title").innerText = "● Durum: " + err.type;
                  }
                });
              }

              function ortakPeerAyarlari() {
                myPeer.on("call", function(call) {
                  call.answer(localStream);
                  aramayiYonet(call, call.metadata ? call.metadata.name : "Arkadaş");
                });
              }

              function hostDinleyicileri() {
                myPeer.on("connection", function(conn) {
                  conn.on("data", function(data) {
                    if (data.type === "join") {
                      peerNames[conn.peer] = data.name;
                      connections[conn.peer] = conn;
                      const existing = Object.keys(connections).filter(function(k) { return k !== conn.peer; }).map(function(k) { return { id: k, name: peerNames[k] }; });
                      conn.send({ type: "peer-list", peers: existing, hostName: myName });
                      kisiyiAra(conn.peer, data.name);
                    } else if (data.type === "music") {
                      videoyuOynat(data.videoId, data.title);
                      herkeseGonder(data);
                    }
                  });
                  conn.on("close", function() { kullaniciSil(conn.peer); });
                });
              }

              function hostaBaglan(hostId) {
                const conn = myPeer.connect(hostId);
                connections[hostId] = conn;
                conn.on("open", function() {
                  conn.send({ type: "join", name: myName });
                });
                conn.on("data", function(data) {
                  if (data.type === "peer-list") {
                    peerNames[hostId] = data.hostName;
                    data.peers.forEach(function(p) {
                      peerNames[p.id] = p.name;
                      kisiyiAra(p.id, p.name);
                    });
                  } else if (data.type === "music") {
                    videoyuOynat(data.videoId, data.title);
                  }
                });
              }

              function kisiyiAra(targetId, targetName) {
                const call = myPeer.call(targetId, localStream, { metadata: { name: myName } });
                aramayiYonet(call, targetName);
              }

              function aramayiYonet(call, remoteName) {
                call.on("stream", function(remoteStream) {
                  const nameToShow = peerNames[call.peer] || remoteName || "Arkadaş";
                  sesMikseriEkle(call.peer, nameToShow, remoteStream);
                });
                call.on("close", function() { kullaniciSil(call.peer); });
              }

              function sesMikseriEkle(peerId, name, stream) {
                if (document.getElementById("user-" + peerId)) return;

                const source = audioCtx.createMediaStreamSource(stream);
                const gainNode = audioCtx.createGain();
                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                const audio = new Audio();
                audio.srcObject = stream;
                audio.muted = true;
                audio.play().catch(function(){});

                const list = document.getElementById("users-list");
                const row = document.createElement("div");
                row.className = "user-row";
                row.id = "user-" + peerId;
                row.innerHTML = '<span>🎙️ ' + name + '</span><div style="display:flex;align-items:center;gap:8px;"><span class="badge" id="vol-' + peerId + '">100%</span><input type="range" min="0" max="2" step="0.05" value="1" class="slider" /></div>';
                row.querySelector("input").addEventListener("input", function(ev) {
                  const val = parseFloat(ev.target.value);
                  gainNode.gain.value = val;
                  document.getElementById("vol-" + peerId).innerText = Math.round(val * 100) + "%";
                });
                list.appendChild(row);
              }

              function kullaniciSil(peerId) {
                delete connections[peerId];
                const el = document.getElementById("user-" + peerId);
                if (el) el.remove();
              }

              function herkeseGonder(data) {
                Object.values(connections).forEach(function(c) { if (c.open) c.send(data); });
              }

              function mikrofonAcKapat() {
                if (!localStream) return;
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(function(t) { t.enabled = !isMuted; });
                const btn = document.getElementById("mute-self-btn");
                btn.innerText = isMuted ? "🔇 Mikrofon Kapalı" : "🎤 Mikrofon Açık";
                btn.classList.toggle("muted", isMuted);
              }

              function onYouTubeIframeAPIReady() {
                ytPlayer = new YT.Player("yt-player", {
                  height: "90", width: "100%",
                  playerVars: { autoplay: 1, controls: 1 }
                });
              }

              async function youtubeBul(query) {
                const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
                const match = query.match(reg);
                if (match && match[1]) return { videoId: match[1], title: "YouTube Şarkısı (" + match[1] + ")" };

                try {
                  const res = await fetch("https://pipedapi.kavin.rocks/search?q=" + encodeURIComponent(query) + "&filter=music_songs");
                  const data = await res.json();
                  if (data.items && data.items.length > 0) {
                    const item = data.items[0];
                    const vid = item.url.split("v=")[1] || item.url.split("/").pop();
                    return { videoId: vid, title: item.title };
                  }
                } catch (e) {}
                return null;
              }

              function videoyuOynat(videoId, title) {
                document.getElementById("now-playing").innerText = "🎵 Çalıyor: " + title;
                if (ytPlayer && ytPlayer.loadVideoById) {
                  ytPlayer.loadVideoById(videoId);
                  ytPlayer.setVolume(document.getElementById("music-vol").value);
                }
              }

              async function muzikCal() {
                const q = document.getElementById("music-query").value.trim();
                if (!q) return;
                document.getElementById("now-playing").innerText = "Aranıyor...";
                const result = await youtubeBul(q);
                if (result) {
                  videoyuOynat(result.videoId, result.title);
                  herkeseGonder({ type: "music", videoId: result.videoId, title: result.title });
                } else {
                  document.getElementById("now-playing").innerText = "Bulunamadı, lütfen doğrudan YouTube linki yapıştırın.";
                }
              }

              function sesAyarla(val) {
                if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(val);
              }
            </script>
            <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" async></script>
            <script src="https://www.youtube.com/iframe_api" async></script>
          </body>
          </html>
          EOF

          cat << 'EOF' > app/src/main.rs
          #![windows_subsystem = "windows"]
          use std::thread;
          use tao::{
            event::{Event, WindowEvent},
            event_loop::{ControlFlow, EventLoop},
            window::WindowBuilder,
          };
          use wry::WebViewBuilder;
          use tiny_http::{Server, Response, Header};

          fn main() -> wry::Result<()> {
            let html_content = include_str!("index.html");

            let server = Server::http("127.0.0.1:0").unwrap();
            let port = server.server_addr().to_ip().unwrap().port();

            thread::spawn(move || {
              for request in server.incoming_requests() {
                let header = Header::from_bytes(&b"Content-Type"[..], &b"text/html; charset=utf-8"[..]).unwrap();
                let response = Response::from_string(html_content).with_header(header);
                let _ = request.respond(response);
              }
            });

            let event_loop = EventLoop::new();
            let window = WindowBuilder::new()
              .with_title("Ekip Ses v3.0")
              .with_inner_size(tao::dpi::LogicalSize::new(480.0, 650.0))
              .build(&event_loop)
              .unwrap();

            let url = format!("http://127.0.0.1:{}", port);
            let _webview = WebViewBuilder::new(&window)
              .with_url(&url)
              .build()?;

            event_loop.run(move |event, _, control_flow| {
              *control_flow = ControlFlow::Wait;
              if let Event::WindowEvent { event: WindowEvent::CloseRequested, .. } = event {
                *control_flow = ControlFlow::Exit;
              }
            });
          }
          EOF

      - name: .exe Derle
        working-directory: ./app
        run: cargo build --release

      - name: .exe Dosyasini Indirmeye Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: EkipSes-v3-Calisan-Exe
          path: ./app/target/release/ekip-ses-v3.exe
