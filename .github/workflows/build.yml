name: FurkanCELL Masaustu Derleyici (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Node.js ile Dosyalari Hatasiz Olustur
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "app/src"

          $cargo = '[package]
          name = "FurkanCELL"
          version = "6.2.0"
          edition = "2021"

          [dependencies]
          tao = "0.26"
          wry = "0.37"
          tiny_http = "0.12"
          '
          [System.IO.File]::WriteAllText("app/Cargo.toml", $cargo)

          $mainRs = '#![windows_subsystem = "windows"]
          use std::thread;
          use tao::{
            event::{Event, WindowEvent},
            event_loop::{ControlFlow, EventLoop},
            window::WindowBuilder,
          };
          use wry::WebViewBuilder;
          use tiny_http::{Server, Response, Header};

          fn main() -> wry::Result<()> {
            let html_content = include_str!("index.html");
            let server = Server::http("127.0.0.1:0").unwrap();
            let port = server.server_addr().to_ip().unwrap().port();

            thread::spawn(move || {
              for request in server.incoming_requests() {
                let header = Header::from_bytes(&b"Content-Type"[..], &b"text/html; charset=utf-8"[..]).unwrap();
                let response = Response::from_string(html_content).with_header(header);
                let _ = request.respond(response);
              }
            });

            let event_loop = EventLoop::new();
            let window = WindowBuilder::new()
              .with_title("FurkanCELL v6.2")
              .with_inner_size(tao::dpi::LogicalSize::new(540.0, 820.0))
              .build(&event_loop)
              .unwrap();

            let url = format!("http://127.0.0.1:{}", port);
            let _webview = WebViewBuilder::new(&window)
              .with_url(&url)
              .build()?;

            event_loop.run(move |event, _, control_flow| {
              *control_flow = ControlFlow::Wait;
              if let Event::WindowEvent { event: WindowEvent::CloseRequested, .. } = event {
                *control_flow = ControlFlow::Exit;
              }
            });
          }
          '
          [System.IO.File]::WriteAllText("app/src/main.rs", $mainRs)

          $html = '<!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8" />
            <title>FurkanCELL v6.2</title>
            <style>
              * { box-sizing: border-box; }
              body { background: radial-gradient(circle at top right, #4a0e2e, #1a0510 70%); color: #ffe6f2; font-family: system-ui, sans-serif; padding: 16px; margin: 0; min-height: 100vh; overflow-x: hidden; }
              h2, h3 { margin-top: 0; color: #ff85c0; }
              .top-bar { background: linear-gradient(90deg, #ff1493, #ff69b4); color: #fff; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; margin-bottom: 14px; text-align: center; }
              .box { background: rgba(43, 9, 26, 0.92); padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #ff2a85; }
              .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
              input[type="text"] { background: #14030c; color: #fff; border: 1px solid #b81d62; padding: 10px 12px; border-radius: 8px; flex: 1; font-size: 14px; outline: none; }
              button { background: linear-gradient(135deg, #ff1493, #d6006e); color: white; border: none; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
              button.secondary-btn { background: #4a122f; border: 1px solid #ff2a85; }
              button.mute-btn { background: #4a122f; border: 1px solid #ff69b4; }
              button.mute-btn.muted { background: #e60026; border-color: #ff4d4d; }
              .fx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
              .fx-btn { background: #33081e; border: 1px solid #801348; padding: 8px 6px; font-size: 12px; border-radius: 8px; text-align: center; }
              .fx-btn.active { background: linear-gradient(135deg, #ff1493, #ff69b4); border-color: #fff; }
              .user-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 42, 133, 0.25); }
              .slider { width: 110px; accent-color: #ff1493; cursor: pointer; }
              .badge { font-size: 11px; background: #590d32; padding: 4px 8px; border-radius: 6px; color: #ffb3d9; border: 1px solid #ff2a85; }
              .status { font-size: 13px; color: #ff85c0; font-weight: bold; }
              #chat-box { height: 100px; overflow-y: auto; background: #14030c; border: 1px solid #b81d62; border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
              .chat-msg { margin-bottom: 4px; word-break: break-all; }
              .chat-msg span { font-weight: bold; color: #ff85c0; }
              #screen-wrap { display: none; margin-top: 10px; border-radius: 8px; overflow: hidden; background: #000; border: 2px solid #ff2a85; position: relative; }
              .screen-toolbar { display: flex; justify-content: space-between; align-items: center; background: #2b091a; padding: 6px 10px; border-bottom: 1px solid #ff2a85; }
              #remote-screen { width: 100%; max-height: 260px; object-fit: contain; display: block; background: #000; cursor: pointer; }
              #screen-wrap.cinema-fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 99999 !important; margin: 0 !important; border: none !important; border-radius: 0 !important; display: flex !important; flex-direction: column !important; background: #000 !important; }
              #screen-wrap.cinema-fullscreen #remote-screen { flex: 1 !important; max-height: calc(100vh - 42px) !important; width: 100vw !important; }
            </style>
          </head>
          <body>
            <div class="top-bar" id="sys-bar">FurkanCELL v6.2 - Tam Ekran ve Ses Degistirici</div>
            <div class="box" id="login-box">
              <h2>FurkanCELL Giris</h2>
              <div class="row"><input type="text" id="room-input" value="furkancell-1" placeholder="Oda Adi" /></div>
              <div class="row">
                <input type="text" id="username" placeholder="Takma Adin (Orn: Furkan, Baran...)" />
                <button type="button" onclick="baglan()">Odaya Giris Yap</button>
              </div>
            </div>

            <div id="app-box" style="display:none;">
              <div class="box">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                  <div class="status" id="room-title">● FurkanCELL Odasi</div>
                  <div style="display:flex; gap:6px;">
                    <button type="button" class="secondary-btn" onclick="ekranPaylasBaslat()">Ekran Paylas</button>
                    <button type="button" id="mute-self-btn" class="mute-btn" onclick="mikrofonAcKapat()">Mikrofon Acik</button>
                  </div>
                </div>
                <h3>Odadaki Kisiler</h3>
                <div id="users-list"></div>
                <div id="screen-wrap">
                  <div class="screen-toolbar">
                    <span style="font-size:12px; color:#ffb3d9; font-weight:bold;" id="screen-label">Canli Ekran Paylasimi (Cift tikla buyut)</span>
                    <button type="button" onclick="tamEkranYap()" id="fs-btn" style="padding:5px 10px; font-size:11px;">Tam Ekran Yap</button>
                  </div>
                  <video id="remote-screen" autoplay playsinline ondblclick="tamEkranYap()"></video>
                </div>
              </div>

              <div class="box">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <h3 style="margin:0;">Ses Degistirici (Voice Changer)</h3>
                  <span class="badge" id="active-fx-label">Aktif: Normal Ses</span>
                </div>
                <div class="fx-grid">
                  <button type="button" class="fx-btn active" id="fx-normal" onclick="sesEfektiSec(&quot;normal&quot;, &quot;Normal Ses&quot;)">Normal</button>
                  <button type="button" class="fx-btn" id="fx-robot" onclick="sesEfektiSec(&quot;robot&quot;, &quot;Robot Sesi&quot;)">Robot</button>
                  <button type="button" class="fx-btn" id="fx-pirate" onclick="sesEfektiSec(&quot;pirate&quot;, &quot;Korsan / Dev&quot;)">Korsan / Dev</button>
                  <button type="button" class="fx-btn" id="fx-chipmunk" onclick="sesEfektiSec(&quot;chipmunk&quot;, &quot;Sincap (Helyum)&quot;)">Sincap</button>
                  <button type="button" class="fx-btn" id="fx-radio" onclick="sesEfektiSec(&quot;radio&quot;, &quot;Polis Telsizi&quot;)">Telsiz</button>
                  <button type="button" class="fx-btn" id="fx-cave" onclick="sesEfektiSec(&quot;cave&quot;, &quot;Magara Yankisi&quot;)">Magara</button>
                </div>
              </div>

              <div class="box">
                <h3>Oda Yazismasi</h3>
                <div id="chat-box"></div>
                <div class="row" style="margin-bottom:0;">
                  <input type="text" id="chat-input" placeholder="Mesaj yaz..." onkeydown="if(event.key===&quot;Enter&quot;) mesajGonder()" />
                  <button type="button" onclick="mesajGonder()">Gonder</button>
                </div>
              </div>

              <div class="box">
                <h3>FurkanCELL Senkronize Muzik</h3>
                <div class="row">
                  <input type="text" id="music-query" placeholder="YouTube sarki adi veya link yaz..." />
                  <button type="button" onclick="muzikCal()">Kesintisiz Baslat</button>
                </div>
                <div class="row" style="justify-content: space-between;">
                  <button type="button" class="secondary-btn" onclick="ortakDurdurBaslat()">Herkeste Durdur / Baslat</button>
                  <button type="button" class="secondary-btn" onclick="siradakiSarki()">Siradaki Sarki</button>
                </div>
                <p id="now-playing" style="font-size:13px; color:#ff85c0; font-weight:bold; margin: 6px 0;">Su an calan: Yok</p>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
                  <span style="font-size:13px;">Muzik Sesi:</span>
                  <input type="range" id="music-vol" min="0" max="100" value="45" class="slider" oninput="sesAyarla(this.value)" />
                </div>
                <div id="yt-wrap" style="margin-top:10px; border-radius:8px; overflow:hidden; height:95px; background:#000; border:1px solid #ff2a85;">
                  <div id="yt-player"></div>
                </div>
              </div>
            </div>

            <script>
              let rawMicStream = null, localStream = null, screenStream = null, audioCtx = null;
              let micSourceNode = null, processedDestNode = null, activeEffectNodes = [], activeEffectOsc = null;
              let ytPlayer = null, isMuted = false, myPeer = null, isHost = false, myName = "Oyuncu";
              let ignoreStateChange = false, radioQueue = [], currentQueueIndex = 0;
              const connections = {}, peerNames = {};

              function tamEkranYap() {
                const wrap = document.getElementById("screen-wrap");
                const btn = document.getElementById("fs-btn");
                if (wrap.classList.contains("cinema-fullscreen")) {
                  wrap.classList.remove("cinema-fullscreen");
                  btn.innerText = "Tam Ekran Yap";
                  if (document.fullscreenElement) document.exitFullscreen().catch(function(){});
                } else {
                  wrap.classList.add("cinema-fullscreen");
                  btn.innerText = "Tam Ekrandan Cik (ESC)";
                  if (wrap.requestFullscreen) wrap.requestFullscreen().catch(function(){});
                }
              }

              document.addEventListener("keydown", function(e) {
                if (e.key === "Escape") {
                  document.getElementById("screen-wrap").classList.remove("cinema-fullscreen");
                  document.getElementById("fs-btn").innerText = "Tam Ekran Yap";
                }
              });

              function sesIslemcisiniKur(stream) {
                micSourceNode = audioCtx.createMediaStreamSource(stream);
                processedDestNode = audioCtx.createMediaStreamDestination();
                sesEfektiUygula("normal");
                return processedDestNode.stream;
              }

              function temizleEfektDugumleri() {
                if (micSourceNode) { try { micSourceNode.disconnect(); } catch(e) {} }
                activeEffectNodes.forEach(function(n) { try { n.disconnect(); } catch(e) {} });
                activeEffectNodes = [];
                if (activeEffectOsc) { try { activeEffectOsc.stop(); activeEffectOsc.disconnect(); } catch(e) {} activeEffectOsc = null; }
              }

              function sesEfektiSec(effectKey, labelText) {
                document.getElementById("active-fx-label").innerText = "Aktif: " + labelText;
                document.querySelectorAll(".fx-btn").forEach(function(b) { b.classList.remove("active"); });
                const activeBtn = document.getElementById("fx-" + effectKey);
                if (activeBtn) activeBtn.classList.add("active");
                sesEfektiUygula(effectKey);
              }

              function makeDistortionCurve(amount) {
                const k = amount || 50, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180;
                for (let i = 0; i < n_samples; i = i + 1) {
                  const x = (i * 2) / n_samples - 1;
                  curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
                }
                return curve;
              }

              function sesEfektiUygula(mode) {
                if (!micSourceNode || !processedDestNode) return;
                temizleEfektDugumleri();
                if (mode === "normal") {
                  micSourceNode.connect(processedDestNode);
                } else if (mode === "robot") {
                  const ringGain = audioCtx.createGain();
                  ringGain.gain.value = 0;
                  const osc = audioCtx.createOscillator();
                  osc.type = "sawtooth";
                  osc.frequency.value = 55;
                  osc.connect(ringGain.gain);
                  osc.start();
                  activeEffectOsc = osc;
                  const outGain = audioCtx.createGain();
                  outGain.gain.value = 1.6;
                  micSourceNode.connect(ringGain);
                  ringGain.connect(outGain);
                  outGain.connect(processedDestNode);
                  activeEffectNodes.push(ringGain, outGain);
                } else if (mode === "pirate" || mode === "chipmunk") {
                  const processor = audioCtx.createScriptProcessor(2048, 1, 1);
                  const pitchRatio = (mode === "pirate")
